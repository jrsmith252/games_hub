<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Match — Game Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0f1a;
            --bg-card: #141b2d;
            --text-primary: #f0f4fc;
            --text-secondary: #8892a8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #22c55e;
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(20, 27, 45, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .game-title {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .menu-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .menu-btn svg {
            width: 20px;
            height: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 16px 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .game-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .game-board {
            display: grid;
            gap: 8px;
            max-width: 400px;
            width: 100%;
        }

        .game-board.size-4 { grid-template-columns: repeat(4, 1fr); }
        .game-board.size-6 { grid-template-columns: repeat(4, 1fr); }
        .game-board.size-8 { grid-template-columns: repeat(4, 1fr); }

        .card {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            opacity: 0.6;
            cursor: default;
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            font-size: 2rem;
        }

        .card-back {
            background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
        }

        .card-back::after {
            content: '?';
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            color: rgba(255,255,255,0.5);
        }

        .card-front {
            background: var(--bg-card);
            border: 2px solid rgba(255,255,255,0.1);
            transform: rotateY(180deg);
        }

        .bottom-controls {
            padding: 20px;
            padding-bottom: 36px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .difficulty-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .diff-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .diff-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .diff-btn:hover:not(.active) {
            background: rgba(255,255,255,0.05);
        }

        .control-btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: var(--accent);
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .modal h2.win {
            background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .modal-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .modal-stat-value {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .modal-stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-actions .control-btn.secondary {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .instructions-content {
            text-align: left;
            margin-bottom: 24px;
        }

        .instructions-content p {
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .instructions-content p strong {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div class="game-title">Memory Match</div>
        <button class="menu-btn" onclick="document.getElementById('instructionsModal').classList.add('active')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value" id="moves">0</div>
            <div class="stat-label">Moves</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="pairs">0/0</div>
            <div class="stat-label">Pairs</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="time">0:00</div>
            <div class="stat-label">Time</div>
        </div>
    </div>

    <div class="game-container">
        <div class="game-board size-4" id="gameBoard"></div>
    </div>

    <div class="bottom-controls">
        <div class="difficulty-selector">
            <button class="diff-btn active" data-pairs="6">6 Pairs</button>
            <button class="diff-btn" data-pairs="8">8 Pairs</button>
            <button class="diff-btn" data-pairs="10">10 Pairs</button>
        </div>
        <button class="control-btn" onclick="newGame()">New Game</button>
    </div>

    <!-- Instructions Modal -->
    <div class="modal-overlay" id="instructionsModal">
        <div class="modal">
            <h2>How to Play</h2>
            <div class="instructions-content">
                <p><strong>Goal:</strong> Find all matching pairs of cards.</p>
                <p><strong>Controls:</strong> Tap a card to flip it. Tap another to find its match.</p>
                <p><strong>Tips:</strong> Remember card positions. Fewer moves = better score!</p>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="document.getElementById('instructionsModal').classList.remove('active'); localStorage.setItem('memoryMatch_instructionsSeen', 'true');">Got it</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div class="modal-overlay" id="winModal">
        <div class="modal">
            <h2 class="win">All Pairs Found!</h2>
            <p>Great memory!</p>
            <div class="modal-stats">
                <div class="stat">
                    <div class="modal-stat-value" id="finalMoves">0</div>
                    <div class="modal-stat-label">Moves</div>
                </div>
                <div class="stat">
                    <div class="modal-stat-value" id="finalTime">0:00</div>
                    <div class="modal-stat-label">Time</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="document.getElementById('winModal').classList.remove('active'); newGame();">Play Again</button>
                <button class="control-btn secondary" onclick="window.location.href='../../index.html'">Back to Hub</button>
            </div>
        </div>
    </div>

    <script>
        const EMOJIS = ['🎮', '🎲', '🎯', '🎨', '🎭', '🎪', '🎢', '🎡', '🎠', '🎰', '🎳', '🎸'];
        
        let gameState = {
            pairs: 6,
            moves: 0,
            matchedPairs: 0,
            time: 0,
            isPlaying: false,
            canFlip: true,
            flippedCards: [],
            cards: []
        };

        let timerInterval = null;

        function initGame() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            gameState.moves = 0;
            gameState.matchedPairs = 0;
            gameState.time = 0;
            gameState.isPlaying = false;
            gameState.canFlip = true;
            gameState.flippedCards = [];
            
            clearInterval(timerInterval);
            updateStats();

            // Create card pairs
            const emojis = EMOJIS.slice(0, gameState.pairs);
            gameState.cards = [...emojis, ...emojis];
            shuffleArray(gameState.cards);

            // Update board size class
            board.className = 'game-board';
            if (gameState.pairs <= 6) board.classList.add('size-4');
            else if (gameState.pairs <= 8) board.classList.add('size-6');
            else board.classList.add('size-8');

            // Create card elements
            gameState.cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">${emoji}</div>
                `;
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function flipCard(card) {
            if (!gameState.canFlip) return;
            if (card.classList.contains('flipped')) return;
            if (card.classList.contains('matched')) return;

            // Start timer on first flip
            if (!gameState.isPlaying) {
                gameState.isPlaying = true;
                startTimer();
            }

            card.classList.add('flipped');
            gameState.flippedCards.push(card);

            if (gameState.flippedCards.length === 2) {
                gameState.moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            gameState.canFlip = false;
            const [card1, card2] = gameState.flippedCards;

            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                gameState.matchedPairs++;
                gameState.flippedCards = [];
                gameState.canFlip = true;
                updateStats();

                if (gameState.matchedPairs === gameState.pairs) {
                    onWin();
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    gameState.flippedCards = [];
                    gameState.canFlip = true;
                }, 800);
            }
        }

        function onWin() {
            gameState.isPlaying = false;
            clearInterval(timerInterval);

            document.getElementById('finalMoves').textContent = gameState.moves;
            document.getElementById('finalTime').textContent = formatTime(gameState.time);
            document.getElementById('winModal').classList.add('active');
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (gameState.isPlaying) {
                    gameState.time++;
                    updateStats();
                }
            }, 1000);
        }

        function updateStats() {
            document.getElementById('moves').textContent = gameState.moves;
            document.getElementById('pairs').textContent = `${gameState.matchedPairs}/${gameState.pairs}`;
            document.getElementById('time').textContent = formatTime(gameState.time);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function newGame() {
            initGame();
        }

        // Difficulty buttons
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameState.pairs = parseInt(btn.dataset.pairs);
                newGame();
            });
        });

        // Show instructions on first visit
        if (!localStorage.getItem('memoryMatch_instructionsSeen')) {
            document.getElementById('instructionsModal').classList.add('active');
        }

        // Start game
        initGame();
    </script>
</body>
</html>
