<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Block Drop — Game Hub</title>
    <link rel="stylesheet" href="../../shared/fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0a0f1a;
            --bg-card: #141b2d;
            --text-primary: #f0f4fc;
            --text-secondary: #8892a8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
        }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px;
            background: rgba(20, 27, 45, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-primary); text-decoration: none;
        }
        .back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .game-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; }
        .menu-btn {
            width: 40px; height: 40px; border-radius: 10px; background: transparent;
            border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary);
        }
        .stats-bar { display: flex; justify-content: center; gap: 24px; padding: 12px 20px; }
        .stat { text-align: center; }
        .stat-value { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 700; }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
        .game-area { display: flex; justify-content: center; gap: 16px; padding: 10px 20px; flex: 1; align-items: flex-start; }
        #gameCanvas { background: var(--bg-card); border-radius: 8px; }
        .side-panel { display: flex; flex-direction: column; gap: 12px; }
        .next-box { background: var(--bg-card); border-radius: 8px; padding: 8px; }
        .next-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; text-align: center; }
        #nextCanvas { display: block; margin: 0 auto; }
        .controls {
            display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px);
            gap: 6px; justify-content: center; padding: 10px;
        }
        .ctrl-btn {
            width: 50px; height: 50px; border-radius: 10px;
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { background: var(--accent); }
        .ctrl-btn.rotate { grid-column: 2; }
        .ctrl-btn.left { grid-column: 1; grid-row: 2; }
        .ctrl-btn.down { grid-column: 2; grid-row: 2; }
        .ctrl-btn.right { grid-column: 3; grid-row: 2; }
        .bottom-controls { padding: 10px 20px 30px; display: flex; gap: 12px; justify-content: center; }
        .control-btn {
            padding: 12px 24px; border-radius: 12px; font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none;
            background: var(--accent); color: white;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: 20px; padding: 32px; text-align: center;
            max-width: 320px; width: 100%; border: 1px solid rgba(255,255,255,0.1);
        }
        .modal h2 { font-family: 'Fraunces', serif; font-size: 1.75rem; margin-bottom: 8px; }
        .modal h2.lose { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal p { color: var(--text-secondary); margin-bottom: 24px; }
        .modal-stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
        .modal-stat-value { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; }
        .modal-stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-actions .control-btn.secondary { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); }
        .instructions-content { text-align: left; margin-bottom: 24px; }
        .instructions-content p { color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
        .instructions-content p strong { color: var(--text-primary); }
    </style>

    <meta name="theme-color" content="#0a0f1a">
    <meta name="hub-root" content="../../">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" href="../../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <link rel="stylesheet" href="../../shared/base.css">
    <script src="../../shared/hub.js"></script>
</head>
<body>
    <div class="top-bar">
        <a href="../../index.html" class="back-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
        <div class="game-title">Block Drop</div>
        <button class="menu-btn" onclick="document.getElementById('instructionsModal').classList.add('active')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat"><div class="stat-value" id="score">0</div><div class="stat-label">Score</div></div>
        <div class="stat"><div class="stat-value" id="best">0</div><div class="stat-label">Best</div></div>
        <div class="stat"><div class="stat-value" id="lines">0</div><div class="stat-label">Lines</div></div>
        <div class="stat"><div class="stat-value" id="level">1</div><div class="stat-label">Level</div></div>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas" width="200" height="400"></canvas>
        <div class="side-panel">
            <div class="next-box">
                <div class="next-label">Next</div>
                <canvas id="nextCanvas" width="80" height="80"></canvas>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn rotate" onclick="rotate()">↻</button>
        <button class="ctrl-btn left" onclick="moveLeft()">←</button>
        <button class="ctrl-btn down" onclick="moveDown()">↓</button>
        <button class="ctrl-btn right" onclick="moveRight()">→</button>
    </div>

    <div class="bottom-controls">
        <button class="control-btn" onclick="startGame()">New Game</button>
    </div>

    <div class="modal-overlay" id="instructionsModal">
        <div class="modal">
            <h2>How to Play</h2>
            <div class="instructions-content">
                <p><strong>Goal:</strong> Complete horizontal lines to clear them and score points!</p>
                <p><strong>Controls:</strong> ← → to move, ↻ to rotate, ↓ to drop faster.</p>
                <p><strong>Tips:</strong> Don't let blocks stack to the top!</p>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="document.getElementById('instructionsModal').classList.remove('active'); localStorage.setItem('tetris_instructionsSeen', 'true');">Got it</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="gameOverModal">
        <div class="modal">
            <h2 class="lose">Game Over</h2>
            <p>The blocks reached the top!</p>
            <div class="modal-stats">
                <div class="stat"><div class="modal-stat-value" id="finalScore">0</div><div class="modal-stat-label">Score</div></div>
                <div class="stat"><div class="modal-stat-value" id="finalLines">0</div><div class="modal-stat-label">Lines</div></div>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="document.getElementById('gameOverModal').classList.remove('active'); startGame();">Play Again</button>
                <button class="control-btn secondary" onclick="window.location.href='../../index.html'">Back to Hub</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        const COLS = 10, ROWS = 20, BLOCK = 20;
        const COLORS = ['#3b82f6', '#22c55e', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
        const SHAPES = [
            [[1,1,1,1]], // I
            [[1,1],[1,1]], // O
            [[0,1,0],[1,1,1]], // T
            [[1,0,0],[1,1,1]], // L
            [[0,0,1],[1,1,1]], // J
            [[0,1,1],[1,1,0]], // S
            [[1,1,0],[0,1,1]]  // Z
        ];

        let board, piece, nextPiece, score, lines, level, gameLoop, gameRunning;
        let best = parseInt(localStorage.getItem('blockdrop_best')) || 0;

        function createPiece() {
            const idx = Math.floor(Math.random() * SHAPES.length);
            return {
                shape: SHAPES[idx].map(row => [...row]),
                color: COLORS[idx],
                x: Math.floor(COLS / 2) - 1,
                y: 0
            };
        }

        function startGame() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            piece = createPiece();
            nextPiece = createPiece();
            score = 0; lines = 0; level = 1;
            gameRunning = true;
            document.getElementById('best').textContent = best;
            updateStats();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(tick, 1000 - (level - 1) * 100);
            draw();
            drawNext();
        }

        function tick() {
            if (!gameRunning) return;
            if (!move(0, 1)) {
                freeze();
                clearLines();
                piece = nextPiece;
                nextPiece = createPiece();
                drawNext();
                if (collision(piece, 0, 0)) {
                    gameOver();
                }
            }
            draw();
        }

        function collision(p, dx, dy) {
            for (let y = 0; y < p.shape.length; y++) {
                for (let x = 0; x < p.shape[y].length; x++) {
                    if (p.shape[y][x]) {
                        const nx = p.x + x + dx;
                        const ny = p.y + y + dy;
                        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
                        if (ny >= 0 && board[ny][nx]) return true;
                    }
                }
            }
            return false;
        }

        function move(dx, dy) {
            if (!collision(piece, dx, dy)) {
                piece.x += dx;
                piece.y += dy;
                draw();
                return true;
            }
            return false;
        }

        function rotate() {
            if (!gameRunning) return;
            const rotated = piece.shape[0].map((_, i) => piece.shape.map(row => row[i]).reverse());
            const old = piece.shape;
            piece.shape = rotated;
            if (collision(piece, 0, 0)) piece.shape = old;
            draw();
        }

        function freeze() {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        if (piece.y + y >= 0) {
                            board[piece.y + y][piece.x + x] = piece.color;
                        }
                    }
                }
            }
        }

        function clearLines() {
            let cleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    cleared++;
                    y++;
                }
            }
            if (cleared) {
                lines += cleared;
                score += [0, 100, 300, 500, 800][cleared] * level;
                level = Math.floor(lines / 10) + 1;
                clearInterval(gameLoop);
                gameLoop = setInterval(tick, Math.max(100, 1000 - (level - 1) * 100));
                updateStats();
            }
        }

        function draw() {
            ctx.fillStyle = '#141b2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw board
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        ctx.fillStyle = board[y][x];
                        ctx.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
                    }
                }
            }
            
            // Draw piece
            if (piece) {
                ctx.fillStyle = piece.color;
                for (let y = 0; y < piece.shape.length; y++) {
                    for (let x = 0; x < piece.shape[y].length; x++) {
                        if (piece.shape[y][x]) {
                            ctx.fillRect((piece.x + x) * BLOCK + 1, (piece.y + y) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
                        }
                    }
                }
            }
        }

        function drawNext() {
            nextCtx.fillStyle = '#141b2d';
            nextCtx.fillRect(0, 0, 80, 80);
            if (nextPiece) {
                nextCtx.fillStyle = nextPiece.color;
                const offsetX = (80 - nextPiece.shape[0].length * 16) / 2;
                const offsetY = (80 - nextPiece.shape.length * 16) / 2;
                for (let y = 0; y < nextPiece.shape.length; y++) {
                    for (let x = 0; x < nextPiece.shape[y].length; x++) {
                        if (nextPiece.shape[y][x]) {
                            nextCtx.fillRect(offsetX + x * 16 + 1, offsetY + y * 16 + 1, 14, 14);
                        }
                    }
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLines').textContent = lines;
            document.getElementById('gameOverModal').classList.add('active');
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;
            if (score > best) {
                best = score;
                localStorage.setItem('blockdrop_best', best);
            }
            document.getElementById('best').textContent = best;
        }

        function moveLeft() { if (gameRunning) move(-1, 0); }
        function moveRight() { if (gameRunning) move(1, 0); }
        function moveDown() { if (gameRunning) move(0, 1); }

        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowLeft': move(-1, 0); e.preventDefault(); break;
                case 'ArrowRight': move(1, 0); e.preventDefault(); break;
                case 'ArrowDown': move(0, 1); e.preventDefault(); break;
                case 'ArrowUp': rotate(); e.preventDefault(); break;
            }
        });

        if (!localStorage.getItem('blockdrop_instructionsSeen')) {
            document.getElementById('instructionsModal').classList.add('active');
        }

        document.getElementById('best').textContent = best;
        startGame();
    </script>
</body>
</html>
