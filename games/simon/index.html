<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Color Sequence — Game Hub</title>
    <link rel="stylesheet" href="../../shared/fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0a0f1a;
            --bg-card: #141b2d;
            --text-primary: #f0f4fc;
            --text-secondary: #8892a8;
            --accent: #6366f1;
        }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px;
            background: rgba(20, 27, 45, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-primary); text-decoration: none;
        }
        .back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .game-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; }
        .menu-btn {
            width: 40px; height: 40px; border-radius: 10px; background: transparent;
            border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary);
        }
        .stats-bar { display: flex; justify-content: center; gap: 32px; padding: 16px 20px; }
        .stat { text-align: center; }
        .stat-value { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
        .game-container {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .simon-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 300px;
            width: 100%;
        }
        .simon-btn {
            aspect-ratio: 1;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            opacity: 0.6;
        }
        .simon-btn:active, .simon-btn.active {
            opacity: 1;
            transform: scale(0.95);
        }
        .simon-btn.green { background: #22c55e; box-shadow: 0 0 0 rgba(34, 197, 94, 0); }
        .simon-btn.green.active { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); }
        .simon-btn.red { background: #ef4444; }
        .simon-btn.red.active { box-shadow: 0 0 40px rgba(239, 68, 68, 0.6); }
        .simon-btn.yellow { background: #eab308; }
        .simon-btn.yellow.active { box-shadow: 0 0 40px rgba(234, 179, 8, 0.6); }
        .simon-btn.blue { background: #3b82f6; }
        .simon-btn.blue.active { box-shadow: 0 0 40px rgba(59, 130, 246, 0.6); }
        .simon-btn:disabled { cursor: not-allowed; }
        .simon-btn.wrong { opacity: 1; outline: 4px solid #f0f4fc; animation: simon-shake 0.35s linear; }
        @keyframes simon-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
        .status {
            text-align: center;
            padding: 20px;
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .bottom-controls { padding: 20px 20px 36px; display: flex; gap: 12px; justify-content: center; }
        .control-btn {
            padding: 14px 28px; border-radius: 12px;
            font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; border: none; background: var(--accent); color: white;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: 20px; padding: 32px; text-align: center;
            max-width: 320px; width: 100%; border: 1px solid rgba(255,255,255,0.1);
        }
        .modal h2 { font-family: 'Fraunces', serif; font-size: 1.75rem; margin-bottom: 8px; }
        .modal h2.lose { background: linear-gradient(135deg, #ef4444, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal p { color: var(--text-secondary); margin-bottom: 24px; }
        .modal-stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
        .modal-stat-value { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; }
        .modal-stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-actions .control-btn.secondary { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); }
        .instructions-content { text-align: left; margin-bottom: 24px; }
        .instructions-content p { color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
        .instructions-content p strong { color: var(--text-primary); }
    </style>

    <meta name="theme-color" content="#0a0f1a">
    <meta name="hub-root" content="../../">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" href="../../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <link rel="stylesheet" href="../../shared/base.css">
    <script src="../../shared/hub.js"></script>
</head>
<body>
    <div class="top-bar">
        <a href="../../index.html" class="back-btn" aria-label="Back to hub"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
        <div class="game-title">Color Sequence</div>
        <button class="menu-btn" aria-label="How to play" onclick="openInstructions()">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat"><div class="stat-value" id="score" aria-live="polite">0</div><div class="stat-label">Score</div></div>
        <div class="stat"><div class="stat-value" id="best">0</div><div class="stat-label">Best</div></div>
    </div>

    <div class="game-container">
        <div class="simon-board">
            <button class="simon-btn green" data-color="green" role="button" aria-label="Green" disabled></button>
            <button class="simon-btn red" data-color="red" role="button" aria-label="Red" disabled></button>
            <button class="simon-btn yellow" data-color="yellow" role="button" aria-label="Yellow" disabled></button>
            <button class="simon-btn blue" data-color="blue" role="button" aria-label="Blue" disabled></button>
        </div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">Press Start to play</div>

    <div class="bottom-controls">
        <button class="control-btn" id="mainBtn" onclick="onMainButton()">Start</button>
    </div>

    <div class="modal-overlay" id="instructionsModal" role="dialog" aria-modal="true" aria-label="How to play">
        <div class="modal">
            <h2>How to Play</h2>
            <div class="instructions-content">
                <p><strong>Goal:</strong> Repeat the color sequence as it gets longer!</p>
                <p><strong>Controls:</strong> Watch the pattern, then tap the colors in the same order.</p>
                <p><strong>Tips:</strong> Focus on one color at a time. Say the colors in your head!</p>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="closeInstructions()">Got it</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="gameOverModal" role="dialog" aria-modal="true" aria-label="Game over">
        <div class="modal">
            <h2 class="lose">Game Over</h2>
            <p>Wrong color!</p>
            <div class="modal-stats">
                <div class="stat"><div class="modal-stat-value" id="finalScore">0</div><div class="modal-stat-label">Score</div></div>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="startGame()">Play Again</button>
                <button class="control-btn secondary" onclick="window.location.href='../../index.html'">Back to Hub</button>
            </div>
        </div>
    </div>

    <script>
        const colors = ['green', 'red', 'yellow', 'blue'];
        const frequencies = { green: 329.63, red: 261.63, yellow: 220.00, blue: 164.81 };
        const buttons = document.querySelectorAll('.simon-btn');
        const BEST_KEY = 'simon_best';
        const INSTRUCTIONS_KEY = 'simon_instructionsSeen';

        let sequence = [];
        let playerIndex = 0;
        let score = 0;
        let best = HubStorage.getInt(BEST_KEY, 0, 0);
        let isPlaying = false;
        let audioCtx;
        // Run token: bumping it cancels any in-flight sequence / next-round wait
        let runToken = 0;
        // phase: 'idle' | 'showing' | 'input' | 'between'
        let phase = 'idle';
        let paused = false;
        let statusBeforePause = '';

        document.getElementById('best').textContent = best;

        function modalOpen() {
            return !!document.querySelector('.modal-overlay.active');
        }

        // Must be called synchronously from a user gesture (iOS)
        function ensureAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { /* audio unavailable: game still works silently */ }
            return audioCtx;
        }

        function playTone(color, duration = 300) {
            if (!ensureAudio()) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = frequencies[color];
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration / 1000);
                osc.start();
                osc.stop(audioCtx.currentTime + duration / 1000);
            } catch (e) { /* ignore */ }
        }

        // Low descending buzz, clearly different from the four pure tones
        function playBuzz() {
            if (!ensureAudio()) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                const t = audioCtx.currentTime;
                osc.frequency.setValueAtTime(140, t);
                osc.frequency.exponentialRampToValueAtTime(70, t + 0.5);
                gain.gain.setValueAtTime(0.25, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start();
                osc.stop(t + 0.5);
            } catch (e) { /* ignore */ }
        }

        function flash(color, duration = 300, silent = false) {
            const btn = document.querySelector(`[data-color="${color}"]`);
            btn.classList.add('active');
            if (!silent) playTone(color, duration);
            setTimeout(() => btn.classList.remove('active'), duration);
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Sleep that holds while paused and returns false if this run was cancelled
        async function wait(ms, token) {
            let remaining = ms;
            while (remaining > 0) {
                if (token !== runToken) return false;
                if (paused) { await sleep(100); continue; }
                const step = Math.min(remaining, 25);
                await sleep(step);
                remaining -= step;
            }
            return token === runToken;
        }

        async function playSequence(token) {
            phase = 'showing';
            setStatus('Watch carefully...');
            disableButtons();

            // Modestly faster as the sequence grows
            const step = Math.max(360, 600 - (sequence.length - 1) * 15);
            const lit = Math.max(200, step - 200);

            if (!(await wait(500, token))) return;

            for (let i = 0; i < sequence.length; i++) {
                if (!(await wait(0, token))) return;
                flash(sequence[i], lit);
                if (!(await wait(step, token))) return;
            }

            phase = 'input';
            setStatus('Your turn!');
            playerIndex = 0;
            if (!paused) enableButtons();
        }

        function startGame() {
            document.getElementById('gameOverModal').classList.remove('active');
            if (document.getElementById('instructionsModal').classList.contains('active')) return;
            ensureAudio(); // create/resume synchronously inside the tap handler for iOS
            const token = ++runToken;
            buttons.forEach(btn => btn.classList.remove('active', 'wrong'));
            paused = false;
            setMainLabel();
            sequence = [];
            score = 0;
            isPlaying = true;
            updateStats();
            addToSequence(token);
        }

        function addToSequence(token) {
            if (token !== runToken) return;
            sequence.push(colors[Math.floor(Math.random() * 4)]);
            playSequence(token);
        }

        async function nextRound(token) {
            if (!(await wait(1000, token))) return;
            addToSequence(token);
        }

        function handleClick(color) {
            if (!isPlaying || phase !== 'input' || paused || modalOpen()) return;

            if (color === sequence[playerIndex]) {
                flash(color, 200);
                playerIndex++;

                if (playerIndex === sequence.length) {
                    score++;
                    updateStats();
                    disableButtons();
                    phase = 'between';
                    setStatus('Correct! Next round...');
                    nextRound(runToken);
                }
            } else {
                flash(color, 200, true);
                const btn = document.querySelector(`[data-color="${color}"]`);
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 400);
                playBuzz();
                gameOver();
            }
        }

        function gameOver() {
            isPlaying = false;
            phase = 'idle';
            runToken++;
            disableButtons();

            if (score > best) {
                best = score;
                HubStorage.setInt(BEST_KEY, best);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.add('active');
            updateStats();
        }

        // Pause / resume (explicit resume only)
        function setMainLabel() {
            document.getElementById('mainBtn').textContent = paused ? 'Resume' : 'Start';
        }

        function pauseGame() {
            if (!isPlaying || paused) return;
            paused = true;
            statusBeforePause = document.getElementById('status').textContent;
            disableButtons();
            setStatus('Paused – tap Resume');
            setMainLabel();
        }

        function resumeGame() {
            if (!paused || modalOpen() || document.hidden) return;
            paused = false;
            setStatus(statusBeforePause);
            if (phase === 'input') enableButtons();
            setMainLabel();
        }

        function onMainButton() {
            if (paused) resumeGame();
            else startGame();
        }

        function openInstructions() {
            pauseGame();
            document.getElementById('instructionsModal').classList.add('active');
        }

        function closeInstructions() {
            document.getElementById('instructionsModal').classList.remove('active');
            HubStorage.setFlag(INSTRUCTIONS_KEY, true);
        }

        function enableButtons() {
            buttons.forEach(btn => btn.disabled = false);
        }

        function disableButtons() {
            buttons.forEach(btn => btn.disabled = true);
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', () => handleClick(btn.dataset.color));
        });

        HubPause.onChange(hidden => { if (hidden) pauseGame(); });
        window.addEventListener('blur', pauseGame);

        if (!HubStorage.getFlag(INSTRUCTIONS_KEY)) {
            document.getElementById('instructionsModal').classList.add('active');
        }
    </script>
</body>
</html>
