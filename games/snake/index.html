<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake — Game Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0a0f1a;
            --bg-card: #141b2d;
            --text-primary: #f0f4fc;
            --text-secondary: #8892a8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #22c55e;
        }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(20, 27, 45, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .back-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            text-decoration: none;
        }
        .back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .game-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; }
        .menu-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .menu-btn svg { width: 20px; height: 20px; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            padding: 16px 20px;
        }
        .stat { text-align: center; }
        .stat-value { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); margin-top: 2px; }
        .game-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #gameCanvas {
            background: var(--bg-card);
            border-radius: 12px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 8px;
            justify-content: center;
            padding: 20px;
        }
        .ctrl-btn {
            width: 60px; height: 60px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active { background: var(--accent); }
        .ctrl-btn.up { grid-column: 2; }
        .ctrl-btn.left { grid-column: 1; grid-row: 2; }
        .ctrl-btn.down { grid-column: 2; grid-row: 2; }
        .ctrl-btn.right { grid-column: 3; grid-row: 2; }
        .bottom-controls {
            padding: 10px 20px 36px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .control-btn {
            padding: 14px 28px;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--accent);
            color: white;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            max-width: 320px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal h2 { font-family: 'Fraunces', serif; font-size: 1.75rem; margin-bottom: 8px; }
        .modal h2.win { background: linear-gradient(135deg, #22c55e 0%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal h2.lose { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal p { color: var(--text-secondary); margin-bottom: 24px; }
        .modal-stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
        .modal-stat-value { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 700; }
        .modal-stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-actions .control-btn.secondary { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); }
        .instructions-content { text-align: left; margin-bottom: 24px; }
        .instructions-content p { color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
        .instructions-content p strong { color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../../index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div class="game-title">Snake</div>
        <button class="menu-btn" onclick="document.getElementById('instructionsModal').classList.add('active')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
        </button>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <div class="stat-value" id="score">0</div>
            <div class="stat-label">Score</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="best">0</div>
            <div class="stat-label">Best</div>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <button class="ctrl-btn up" onclick="setDirection(0,-1)">↑</button>
        <button class="ctrl-btn left" onclick="setDirection(-1,0)">←</button>
        <button class="ctrl-btn down" onclick="setDirection(0,1)">↓</button>
        <button class="ctrl-btn right" onclick="setDirection(1,0)">→</button>
    </div>

    <div class="bottom-controls">
        <button class="control-btn" onclick="startGame()">New Game</button>
    </div>

    <div class="modal-overlay" id="instructionsModal">
        <div class="modal">
            <h2>How to Play</h2>
            <div class="instructions-content">
                <p><strong>Goal:</strong> Eat food to grow longer without hitting walls or yourself!</p>
                <p><strong>Controls:</strong> Use arrow keys or the on-screen buttons to change direction.</p>
                <p><strong>Tips:</strong> Plan ahead and don't trap yourself!</p>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="document.getElementById('instructionsModal').classList.remove('active'); localStorage.setItem('snake_instructionsSeen', 'true');">Got it</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="gameOverModal">
        <div class="modal">
            <h2 class="lose">Game Over</h2>
            <p>You crashed!</p>
            <div class="modal-stats">
                <div class="stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="control-btn" onclick="document.getElementById('gameOverModal').classList.remove('active'); startGame();">Play Again</button>
                <button class="control-btn secondary" onclick="window.location.href='../../index.html'">Back to Hub</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID = 20;
        let SIZE;
        let snake, food, direction, nextDirection, score, gameLoop, gameRunning;
        let best = parseInt(localStorage.getItem('snake_best')) || 0;
        document.getElementById('best').textContent = best;

        function resize() {
            const maxSize = Math.min(window.innerWidth - 40, 360);
            SIZE = Math.floor(maxSize / GRID) * GRID;
            canvas.width = SIZE;
            canvas.height = SIZE;
        }

        function startGame() {
            resize();
            snake = [{x: 10, y: 10}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            gameRunning = true;
            placeFood();
            updateStats();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 120);
        }

        function placeFood() {
            const cells = GRID;
            do {
                food = {
                    x: Math.floor(Math.random() * cells),
                    y: Math.floor(Math.random() * cells)
                };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function setDirection(x, y) {
            if (!gameRunning) return;
            if (direction.x === -x && direction.y === -y) return;
            nextDirection = {x, y};
        }

        function update() {
            if (!gameRunning) return;
            
            direction = nextDirection;
            let head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Wrap around edges
            if (head.x < 0) head.x = GRID - 1;
            if (head.x >= GRID) head.x = 0;
            if (head.y < 0) head.y = GRID - 1;
            if (head.y >= GRID) head.y = 0;

            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateStats();
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            const cellSize = SIZE / GRID;
            ctx.fillStyle = '#141b2d';
            ctx.fillRect(0, 0, SIZE, SIZE);

            // Draw food
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(
                food.x * cellSize + cellSize / 2,
                food.y * cellSize + cellSize / 2,
                cellSize / 2 - 2,
                0, Math.PI * 2
            );
            ctx.fill();

            // Draw snake
            snake.forEach((segment, i) => {
                const brightness = 1 - (i / snake.length) * 0.5;
                ctx.fillStyle = `hsl(142, 71%, ${45 * brightness}%)`;
                ctx.fillRect(
                    segment.x * cellSize + 1,
                    segment.y * cellSize + 1,
                    cellSize - 2,
                    cellSize - 2
                );
            });
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            if (score > best) {
                best = score;
                localStorage.setItem('snake_best', best);
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').classList.add('active');
            updateStats();
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': setDirection(0, -1); e.preventDefault(); break;
                case 'ArrowDown': setDirection(0, 1); e.preventDefault(); break;
                case 'ArrowLeft': setDirection(-1, 0); e.preventDefault(); break;
                case 'ArrowRight': setDirection(1, 0); e.preventDefault(); break;
            }
        });

        // Touch swipe
        let touchStart = null;
        document.addEventListener('touchstart', e => {
            touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        }, {passive: true});
        document.addEventListener('touchend', e => {
            if (!touchStart) return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                setDirection(dx > 0 ? 1 : -1, 0);
            } else if (Math.abs(dy) > 30) {
                setDirection(0, dy > 0 ? 1 : -1);
            }
            touchStart = null;
        }, {passive: true});

        if (!localStorage.getItem('snake_instructionsSeen')) {
            document.getElementById('instructionsModal').classList.add('active');
        }

        window.addEventListener('resize', resize);
        startGame();
    </script>
</body>
</html>
